<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow • To-Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="app">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>Taskflow</h1>
            </div>
            <p class="subtitle">Kelola tugas harianmu dengan lebih elegan</p>
        </header>

        <form id="form-todo">
            <div class="input-group">
                <input type="text" id="input-todo" placeholder="Apa yang ingin kamu selesaikan hari ini?" required autocomplete="off">
                <button type="submit">
                    <span>Tambah</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </form>

        <div class="stats-card">
            <span id="stats">0 tugas belum selesai</span>
        </div>

        <ul id="list-todo"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
